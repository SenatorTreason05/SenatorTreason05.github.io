<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131517" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Apply the stored colour scheme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* storage unavailable; fall back to prefers-color-scheme */ }
    })();
  </script>

  <!-- Paint the theme's background immediately, before the stylesheet arrives,
       so moving between pages never shows the browser's default white.
       Values match --bg in style.scss. -->
  <style>
    html { background: #fcfcfc; }
    @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #131517; } }
    html[data-theme="dark"] { background: #131517; }
  </style>

  <!-- Titled here rather than by jekyll-seo-tag, which insists on appending
       the tagline (or the description) to the home page title. -->
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  {% seo title=false %}

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&family=Jost:wght@300;400;500;700&family=Montserrat:ital,wght@0,300;0,400;0,600;1,300&display=swap">

  {% if page.url == '/fun/' %}
    <!-- Chessground's three layers, loaded BEFORE the site stylesheet so
         style.scss can still override cg-board. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground@10.4.0/assets/chessground.base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground@10.4.0/assets/chessground.brown.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground@10.4.0/assets/chessground.cburnett.css">
  {% endif %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
