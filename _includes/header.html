<header class="site-header">
  <div class="container nav-wrap">
    <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      {{ site.short_name | default: site.title }}
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Toggle navigation</span>
      <span></span><span></span><span></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        <a href="{{ item_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      {% if site.show_cv %}
        <a href="{{ site.cv_path | relative_url }}">CV</a>
      {% endif %}
    </nav>
  </div>
</header>
