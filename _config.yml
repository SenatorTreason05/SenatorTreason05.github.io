# ------------------------------------------------------------
# Personal site settings — edit these first
# ------------------------------------------------------------
title: "Adi Raj"
short_name: "Adi Raj"
description: "Personal academic website for Adi Raj."

# User site: SenatorTreason05.github.io
url: "https://senatortreason05.github.io"
baseurl: ""

# Profile
name: "Adi Raj"
role: "A.B./A.M. in Mathematics and Physics"
affiliation: "Harvard University"
location: ""

# Written out longhand so address-harvesting bots do not pick it up.
# Shown as plain text, not as a mailto: link.
email: "araj [at] college.harvard.edu"

# Portrait for the home page. Drop a portrait-orientation image in
# assets/images/ and point to it, e.g. "/assets/images/portrait.jpg".
# Left empty, the site shows your initials in a framed placeholder.
portrait: "/assets/images/portrait.jpg"

# Links
linkedin_url: "https://www.linkedin.com/in/aditya-raj4/"

# Puzzles below this Lichess rating are skipped when fetching a hard puzzle.
puzzle_min_rating: 2000

# The (CV) link beside the Bio heading. Drop the PDF at assets/files/cv.pdf;
# until then the link is live but resolves to nothing.
show_cv: true
cv_path: "/assets/files/cv.pdf"

# Site behavior
permalink: pretty
markdown: kramdown
highlighter: rouge
future: false

# Plugins supported by GitHub Pages / the github-pages gem
plugins:
  - jekyll-seo-tag

# Keep build output tidy
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - assets/images/research/source

# Defaults for ordinary pages

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
