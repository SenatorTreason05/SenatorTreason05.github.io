# ------------------------------------------------------------
# Personal site settings — edit these first
# ------------------------------------------------------------
title: "Adi Raj"
short_name: "Adi Raj"
description: "Personal academic website for Adi Raj."

# User site: SenatorTreason05.github.io (no custom domain)
url: "https://senatortreason05.github.io"
baseurl: ""

# Profile
name: "Adi Raj"
role: "A.B./A.M. in Mathematics and Physics"
affiliation: "Harvard University"
location: ""

# The address is never written out in the repo or the built HTML: this is
# the email reversed, then base64-encoded. assets/js/main.js decodes it in
# the visitor's browser and turns it into a mailto: link. To change it, run
#   python -c "import base64;print(base64.b64encode('you@example.com'[::-1].encode()).decode())"
email_encoded: "dWRlLmRyYXZyYWguZWdlbGxvY0BqYXJh"

# Portrait for the home page. Drop a portrait-orientation image in
# assets/images/ and point to it, e.g. "/assets/images/portrait.jpg".
# Left empty, the site shows your initials in a framed placeholder.
portrait: "/assets/images/portrait.jpg"

# Links
linkedin_url: "https://www.linkedin.com/in/aditya-raj4/"

# Puzzles below this Lichess rating are skipped when fetching a hard puzzle.
puzzle_min_rating: 2000

# The (CV) link beside the Bio heading. To update it, replace
# assets/files/cv.pdf with the new PDF (keep the filename).
show_cv: true
cv_path: "/assets/files/cv.pdf"

# Site behavior
permalink: pretty
markdown: kramdown
highlighter: rouge
future: false

# Plugins supported by GitHub Pages / the github-pages gem
plugins:
  - jekyll-seo-tag

# Keep build output tidy
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - assets/images/research/source

# Defaults for ordinary pages

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
