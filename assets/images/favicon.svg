<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Site icon: a 4x4 Schubert checkerboard (after Vakil's checker games).
    Transparent background; ink follows the browser's light/dark scheme
    using the site's text-strong colours (see style.scss).

    To move a checker, change its cx/cy. Square centres are
      columns (cx): 11  25  39  53     (left to right)
      rows    (cy): 11  25  39  53     (top to bottom)
    One checker per row and column keeps it a genuine black-checker
    configuration; currently the permutation 2 4 1 3.
  -->
  <style>
    .ink { fill: #2a2420; stroke: #2a2420; }
    @media (prefers-color-scheme: dark) { .ink { fill: #f0f3f9; stroke: #f0f3f9; } }
  </style>
  <g class="ink">
    <path fill="none" stroke-width="1.6" stroke-opacity=".55"
          d="M4 4H60V60H4Z M18 4V60 M32 4V60 M46 4V60 M4 18H60 M4 32H60 M4 46H60"/>
    <g stroke="none">
      <circle cx="25" cy="11" r="5.2"/>
      <circle cx="53" cy="25" r="5.2"/>
      <circle cx="11" cy="39" r="5.2"/>
      <circle cx="39" cy="53" r="5.2"/>
    </g>
  </g>
</svg>
