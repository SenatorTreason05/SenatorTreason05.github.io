- title: "Causal Representation Learning from Interventions"
  category: "ongoing"
  status: "2025–Present · Harvard SEAS Applied Algebra Group"
  description: >
    I'm studying when the shared causal structure of latent-variable LSEMs can be recovered from multiple unpaired linear representations of the same underlying system. 
    For non-Gaussian data, I develop identifiability results showing how perfect interventions distributed across different views can recover the latent causal graph and the observation map for each view.
    This approach reduces the number of interventions necessary for full recovery.
  image: "/assets/images/research/causal.svg"
  image_alt: "Latent variables Z_1 to Z_d forming a causal graph, each targeted by one interventional context k, and linearly mixed into two observed groups X = G_X Z and Y = G_Y Z"
  links: []


- title: "The Geometric Littlewood–Richardson Rule for Orthogonal Schubert Calculus"

  category: "ongoing"
  status: "2026–Present · Harvard Math Department · Senior Thesis"
  description: >
    I'm looking at how the solutions to incidence problems on orthogonal Grassmannians
    move and permute as the defining geometric conditions vary. In particular, I'm investigating
    degenerations of Schubert intersections as isotropic flags are specialized
    in Lie types B and D to understand the resulting Galois and
    monodromy groups, and to see how this orthogonality constraint changes the geometric picture from ordinary
    Schubert calculus.
  image: "/assets/images/research/schubert.svg"
  image_alt: "A move in Vakil's checker game for G(2,4): a descending and a rising black checker, with the critical row and diagonal marked, branching into a stay and a swap configuration"
  links: []

- title: "Real Geometry of Determinantal Varieties"
  category: "ongoing"
  status: "2025–Present · Harvard SEAS Applied Algebra Group"
  description: >
    I want to understand how many real low-rank matrices can appear in finite linear sections of determinantal varieties. 
    Although the corresponding number of complex solutions is governed by intersection theory, the number of real solutions can vary with the geometry of the linear section. 
    I'm analyzing the geometric and topological structure constraining these real counts, and working to formulate these results in the language of minimum-rank matrix spaces and identifiability of tensor decompositions.
  image: "/assets/images/research/determinantal.svg"
  image_alt: "The real dual curve of the Edge quartic, with each region labelled 0, 2 or 4 by the number of real intersection points of the corresponding line with the curve"
  links: []

