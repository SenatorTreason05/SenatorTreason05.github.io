- title: "Genomic and Transcriptomic Structure of the Tumor Microenvironment"
  category: "past"
  status: "2025 · Trinity College, University of Cambridge"
  description: >
    At the Early Cancer Institute, I analyzed bulk RNA-seq data to study genomic and transcriptomic determinants of the tumor microenvironment in esophageal cancer. 
    I used multivariate association methods to identify biomarkers of disease progression, and 
    integrated molecular and clinical data to probe how variation in tumor biology and immune composition relates to patient outcomes.
    The broader goal was to characterize this molecular heterogeneity within tumors to make clinical preventative care more effective.
  image: "/assets/images/research/genomics.png"
  image_alt: "Clustered heatmap of tumour-microenvironment cell-type scores across the full OAC cohort, with samples splitting into immune-hot, warm, cool and cold groups"
  links: []

- title: "Statistical Inference for Sparse Astronomical Time Series"
  category: "past"
  status: "2024–2025 · Center for Astrophysics | Harvard & Smithsonian"
  description: >
    I developed statistical methods for recovering temporal structure from sparse
    and irregular astronomical observations. To do so, I built scalable inference pipelines for more than 400,000 Chandra Source Catalog X-ray sources, 
    with an emphasis on recovering temporal variability from sparse and irregular observations.
  image: "/assets/images/research/astronomy.svg"
  image_alt: "A dashed multiperiodic signal m(t) with twenty unevenly spaced noisy observations and their error bars"
  links: []