- title: "Genomic and Transcriptomic Structure of the Tumor Microenvironment"
  category: "past"
  status: "Summer 2025 · Trinity College, University of Cambridge"
  description: >
    Analyzed bulk RNA-seq and whole-genome sequencing data to study genomic and transcriptomic determinants of the tumor microenvironment in esophageal cancer. 
    Used survival modeling and multivariate association methods to identify statistically robust relationships with disease progression and prognosis. 
    Integrated molecular and clinical data to characterize how variation in tumor biology and immune composition relates to patient outcomes.
  image: "/assets/images/research/genomics.png"
  image_alt: "Clustered heatmap of tumour-microenvironment cell-type scores across the full OAC cohort, with samples splitting into immune-hot, warm, cool and cold groups"
  links: []

- title: "Statistical Inference for Sparse Astronomical Time Series"
  category: "past"
  status: "2024–2025 · Center for Astrophysics | Harvard & Smithsonian"
  description: >
    Developed statistical methods for recovering temporal structure from sparse
    and irregular astronomical observations. Built scalable inference pipelines
    for more than 400,000 Chandra Source Catalog X-ray sources, with an emphasis
    on extracting latent variability information from limited observations.
  image: "/assets/images/research/astronomy.svg"
  image_alt: "A dashed multiperiodic signal m(t) with twenty unevenly spaced noisy observations and their error bars"
  links: []