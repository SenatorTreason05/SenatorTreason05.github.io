- title: "Causal Representation Learning from Interventions"
  category: "ongoing"
  status: "2025–Present · Harvard SEAS Applied Algebra Group"
  description: >
    Studying when shared latent causal structure can be recovered from multiple
    unpaired views of the same underlying system. For non-Gaussian data, I develop
    identifiability results showing how interventions distributed across different
    views can recover the latent causal graph and the observation map for each view.
  image: "/assets/images/research/causal.svg"
  image_alt: "Latent variables Z_1 to Z_d forming a causal graph, each targeted by one interventional context k, and linearly mixed into two observed groups X = G_X Z and Y = G_Y Z"
  links: []


- title: "Geometric Littlewood–Richardson Rules and Monodromy in Orthogonal Schubert Calculus"

  category: "ongoing"
  status: "2026–Present · Harvard Math Department · Senior Thesis"
  description: >
    Studying how the solutions to incidence problems on orthogonal Grassmannians
    move and permute as the defining geometric conditions vary. I'm investigating
    degenerations of Schubert intersections as isotropic flags are specialized
    in Lie types B and D to understand the resulting Galois and
    monodromy groups, and how orthogonality changes the geometric picture from ordinary
    Schubert calculus.
  image: "/assets/images/research/schubert.svg"
  image_alt: "A move in Vakil's checker game for G(2,4): a descending and a rising black checker, with the critical row and diagonal marked, branching into a stay and a swap configuration"
  links: []

- title: "Real Geometry of Determinantal Varieties"
  category: "ongoing"
  status: "2025–Present · Harvard SEAS Applied Algebra Group"
  description: >
    Studying how many real low-rank matrices can occur when a real linear space
    intersects a determinantal variety in finitely many points. I am working
    to understand what bounds these real counts and how they connect to
    minimum-rank matrix spaces and identifiability of tensor decompositions.
  image: "/assets/images/research/determinantal.svg"
  image_alt: "The real dual curve of the Edge quartic, with each region labelled 0, 2 or 4 by the number of real intersection points of the corresponding line with the curve"
  links: []

