- course: "MATH 137 — Algebraic Geometry [Prof. Joe Harris]"
  role: "Course Assistant"
  term: "Spring 2026"
  description: >
    Content follows Joe Harris'
    <em><a href="https://link.springer.com/book/10.1007/978-1-4757-2189-8">Algebraic Geometry: A First Course</a></em>.
    Topics include affine and projective varieties, regular and rational maps,
    irreducibility, Grassmannians, dimension, Hilbert polynomials, tangent spaces,
    degree, Bézout's theorem, and classical projective varieties.
  materials: "/assets/files/math137-notes.pdf"
  links: []

- course: "MATH 131 — Topology [Prof. Mike Hopkins]"
  role: "Course Assistant"
  term: "Fall 2025"
  description: >
    Content follows James Munkres'
    <em><a href="https://www.pearson.com/en-us/pearsonplus/p/9780137848669">Topology</a></em>.
    Topics include topological spaces and continuous maps, product and quotient
    topologies, connectedness, compactness, separation axioms, and metrization,
    followed by homotopy, fundamental groups, van Kampen's theorem, and covering spaces.
  materials: "/assets/files/math131-notes.pdf"
  links: []

- course: "MATH 113 — Complex Analysis [Prof. Joe Harris]"
  role: "Course Assistant"
  term: "Spring 2025"
  description: >
    Content follows Lars Ahlfors'
    <em><a href="https://books.google.com/books/about/Complex_analysis.html?id=2MRuus-5GGoC">Complex Analysis</a></em>.
    Topics include holomorphic and meromorphic functions, complex integration,
    Cauchy's theorem and integral formula, Laurent series, singularities, residues,
    the argument principle, harmonic functions, and conformal mapping.
  materials: "/assets/files/math113-notes.pdf"
  links: []

- course: "MATH 122 — Group Theory [Prof. Joe Harris]"
  role: "Course Assistant"
  term: "Fall 2024"
  description: >
    Content follows David Dummit and Richard Foote's
    <em><a href="https://www.wiley.com/en-us/General%2B%26%2BIntroductory%2BMathematics/Algebra-c-MA10">Abstract Algebra</a></em>,
    focusing on groups. Topics include subgroups and quotient groups,
    homomorphisms, group actions, permutation groups, the Sylow theorems,
    direct and semidirect products, and finite abelian groups.
  materials: "/assets/files/math122-notes.pdf"
  links: []

- course: "PHYSICS 19 — Theoretical Physics [Prof. Jacob Barandes]"
  role: "Course Assistant"
  term: "Fall 2024"
  description: >
    A first-principles introduction to theoretical physics covering Newtonian and
    analytical mechanics, chaos and orbital dynamics, thermodynamics and statistical
    physics, electromagnetism, relativity and gravitation, black holes, and quantum theory.
  links: []
