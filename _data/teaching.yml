
- course: "MATH 101 — Sets, Groups, and Real Analysis [Prof. Clifford Taubes]"
  role: "Course Assistant"
  term: "Fall 2026"
  description: >
    Content includes construction of number systems and real analysis from John Stillwell's
    <em><a href="https://link.springer.com/book/10.1007/978-3-319-01577-4">The Real Numbers: An Introduction to Set Theory and Analysis</a></em>.
    The algebra portion draws on Charles Pinter's
    <em><a href="https://store.doverpublications.com/collections/math-algebra">A Book of Abstract Algebra</a></em>
    and introduces groups, homomorphisms, and quotient groups.
